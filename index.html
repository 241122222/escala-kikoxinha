<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escala">
<title>Escala Kikoxinha</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F3F4F7;--sup:#FFFFFF;--tinta:#172033;--tinta2:#5A6478;--tinta3:#8A93A5;--linha:#E2E5EC;--linha2:#EEF0F4;
  --ouro:#E8A02E;--ouro-cl:#FFF4DE;--ouro-esc:#9A5B00;
  --verm:#C8321E;--verm-cl:#FDEBE8;--verde:#1F7A45;--verde-cl:#E3F4EA;
  --cF:#DCEAFE;--tF:#1B4F93;--cFE:#DFF3E6;--tFE:#1E6B3A;--cAT:#EDE6FF;--tAT:#5A3A9C;--cFT:#FDE3DF;--tFT:#B42318;
  --r1:6px;--r2:10px;--r3:14px;
  --sombra:0 1px 2px rgba(23,32,51,.06),0 1px 1px rgba(23,32,51,.03);
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-tit:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tinta);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.grande{width:34px;height:34px;color:var(--tinta3)}
.marca{width:30px;height:30px;flex:none}
.mut{color:var(--tinta2)}.small{font-size:13px}

/* estrutura */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:20px 14px;background:var(--tinta);color:#C9CFDB}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand b{display:block;color:#fff;font:700 17px/1.1 var(--f-tit);letter-spacing:-.01em}
.brand span{font-size:12.5px;color:#9AA3B5}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:var(--r1);background:none;color:inherit;font-weight:500;text-align:left;position:relative}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.on{background:rgba(255,255,255,.1);color:#fff}
.nav-i.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ouro)}
.nav-i .badge{margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:#9AA3B5}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tinta3)}
.sync.ok::before{background:#3DBE74}.sync.pend::before{background:var(--ouro)}.sync.err{color:#FF8A7A}.sync.err::before{background:var(--verm)}
.main{min-width:0}
.topbar{display:none}
.cont{max-width:1440px;margin:0 auto;padding:28px 32px 48px}
.bottom{display:none}

/* cabeçalho de página */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font:700 30px/1.1 var(--f-tit);letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--tinta2)}
.ph-a{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph2{margin-top:28px}
.ph2 h1{font-size:22px}
.pager{display:flex;align-items:center;gap:4px;background:var(--sup);border:1px solid var(--linha);border-radius:var(--r2);padding:3px}
.pager-l{position:relative;display:flex;align-items:center;padding:0 10px;min-width:150px;justify-content:center;font:600 15px var(--f-tit);white-space:nowrap}
.pager-l input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.pager .btn.sm{margin-left:2px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:var(--r1);background:none;color:var(--tinta2)}
.ib:hover:not([disabled]){background:var(--linha2);color:var(--tinta)}
.ib[disabled]{opacity:.3;cursor:default}

/* botões */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--linha);border-radius:var(--r2);background:var(--sup);font-weight:600;font-size:14px;white-space:nowrap;box-shadow:var(--sombra)}
.btn:hover:not([disabled]){border-color:#C8CDD8}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn.escuro{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn.escuro:hover:not([disabled]){background:#24304A}
.btn.perigo{color:var(--verm)}
.btn.perigo-f{background:var(--verm);border-color:var(--verm);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.lnk{border:0;background:none;padding:4px 2px;color:var(--tinta);font-weight:600;font-size:14px;text-decoration:underline;text-decoration-color:var(--linha);text-underline-offset:3px}
.lnk:hover{text-decoration-color:currentColor}
.lnk.perigo{color:var(--verm)}
.seg{display:inline-flex;background:var(--linha2);border-radius:var(--r2);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--tinta2);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--sup);color:var(--tinta);box-shadow:var(--sombra)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid var(--linha);background:var(--sup);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;color:var(--tinta2)}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--verm);color:#fff;font:700 11.5px var(--f-ui)}

/* painéis */
.painel{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r3);padding:18px 20px;margin-bottom:16px}
.painel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.painel-h h2,.modal-h h2{margin:0;font:650 17px/1.2 var(--f-tit);letter-spacing:-.01em}
.painel>p{margin:0 0 12px}
.vazio{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:48px 20px;background:var(--sup);border:1px dashed var(--linha);border-radius:var(--r3);color:var(--tinta2)}
.vazio p{max-width:440px;margin:0}
.aviso{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 14px;border-radius:var(--r2);margin-bottom:14px;font-size:14px;border:1px solid}
.aviso.info{background:#EEF4FF;border-color:#CFDDF7}.aviso.warn{background:var(--ouro-cl);border-color:#F3D9A4}.aviso.err{background:var(--verm-cl);border-color:#F5C4BC}
.demo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;margin-bottom:18px;border-radius:var(--r2);background:var(--ouro-cl);border:1px solid #F3D9A4;font-size:14px}
.demo .seg{background:rgba(255,255,255,.6)}
.demo .lnk{margin-left:auto}

/* primeiros passos */
.passos ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.passos li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linha2)}
.passos li:first-child{border-top:0}
.pn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--linha);flex:none;counter-increment:p}
.passos ol{counter-reset:p}
.passos li:not(.feito) .pn::after{content:counter(p);font-size:12px;font-weight:700;color:var(--tinta2)}
.passos li.feito .pn{background:var(--verde);border-color:var(--verde);color:#fff}
.passos li.feito .pn .ic{width:14px;height:14px;stroke-width:2.4}
.passos li.feito .pt{color:var(--tinta3);text-decoration:line-through}
.pt{flex:1;font-weight:500}

/* hoje */
.faixas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:16px}
.faixa{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r2);border:1px solid;text-align:left}
.faixa span{flex:1;display:flex;flex-direction:column;font-size:13px}
.faixa b{font-size:14.5px}
.faixa.ouro{background:var(--ouro-cl);border-color:#F3D9A4;color:var(--ouro-esc)}
.faixa.verm{background:var(--verm-cl);border-color:#F5C4BC;color:var(--verm)}
.faixa b{color:var(--tinta)}
.dia-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tcol{border:1px solid var(--linha);border-radius:var(--r2);padding:14px;background:var(--sup)}
.tcol.fora{background:#FAFBFC}
.tcol.low{border-color:#F2B8AE;box-shadow:inset 0 3px 0 var(--verm)}
.tcol-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.tcol-h b{display:block;font-weight:700}
.tcol-h span{font-size:13px;color:var(--tinta2)}
.cont-n{font:700 22px/1 var(--f-tit);color:var(--tinta)!important}
.cont-n i{font-style:normal;font-size:14px;color:var(--tinta3)}
.cont-n.low{color:var(--verm)!important}
.falta{margin:0 0 10px;padding:6px 9px;border-radius:var(--r1);background:var(--verm-cl);color:var(--verm);font-size:13px;font-weight:600}
.falta.warn{background:var(--ouro-cl);color:var(--ouro-esc);margin:10px 0 0;font-weight:500}
.pessoas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pessoas li{display:flex;align-items:center;gap:10px}
.pessoas li>span:not(.av){flex:1;display:flex;flex-direction:column;line-height:1.25;font-weight:500}
.pessoas small{font-size:12.5px;color:var(--tinta2);font-weight:400}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;font-size:11.5px;font-weight:700;color:var(--tinta);letter-spacing:.02em}
.cod{font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--linha2);color:var(--tinta2)}
.cod.F{background:var(--cF);color:var(--tF)}.cod.FE{background:var(--cFE);color:var(--tFE)}.cod.AT{background:var(--cAT);color:var(--tAT)}.cod.FT{background:var(--cFT);color:var(--tFT)}.cod.T{background:#EEF0F4;color:var(--tinta)}

/* grade */
.grade-p{padding:0;overflow:hidden}
.grade-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--linha)}
.pinceis{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pincel{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:none;border-radius:var(--r1);padding:5px 9px;font-size:13px;font-weight:600;color:var(--tinta2)}
.pincel:hover{background:var(--linha2)}
.pincel.on{background:var(--sup);border-color:var(--tinta);color:var(--tinta);box-shadow:var(--sombra)}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px;flex:none;border:1px solid rgba(23,32,51,.08)}
.sw.F{background:var(--cF)}.sw.T{background:#fff;border-color:var(--linha)}.sw.FE{background:var(--cFE)}.sw.AT{background:var(--cAT)}.sw.FT{background:var(--cFT)}
.sw.tg{background:linear-gradient(135deg,#fff 50%,var(--cF) 50%);border-color:var(--linha)}
.sw.lp{background:repeating-linear-gradient(45deg,#fff 0 3px,var(--linha) 3px 4px)}
.dica{margin-left:6px}
.al-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--verm);background:var(--verm-cl);border-radius:999px;padding:5px 11px;text-decoration:none}
.al-chip.ok{color:var(--verde);background:var(--verde-cl)}
.gridwrap{overflow:auto;max-height:calc(100vh - 230px)}
table.g{border-collapse:separate;border-spacing:0;font-size:12.5px;user-select:none;-webkit-user-select:none;min-width:100%}
table.g th,table.g td{border-bottom:1px solid var(--linha2);padding:0;text-align:center;height:38px;min-width:32px}
table.g thead th{position:sticky;top:0;z-index:3;background:var(--sup);font-weight:700;font-size:12.5px;padding:6px 0;line-height:1.15;border-bottom:1px solid var(--linha);color:var(--tinta)}
table.g thead th span{display:block;font-size:10.5px;font-weight:600;color:var(--tinta3)}
table.g thead th.dom span,table.g thead th.dom{color:var(--verm)}
table.g thead th.sab{background:#FAFBFC}
table.g thead th.hj{background:var(--ouro-cl);box-shadow:inset 0 3px 0 var(--ouro)}
table.g thead th.hj span{color:var(--ouro-esc)}
table.g .nm{position:sticky;left:0;z-index:2;background:var(--sup);text-align:left;padding:4px 12px;min-width:200px;max-width:240px;border-right:1px solid var(--linha)}
table.g thead .nm{z-index:4;font-size:12px;color:var(--tinta2);font-weight:600;vertical-align:bottom}
table.g th.tot,table.g td.tot{min-width:58px;font-size:12px;color:var(--tinta2);font-weight:600}
.pess{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;text-align:left;width:100%;min-width:0}
button.pess:hover b{text-decoration:underline}
.pess>span{display:flex;flex-direction:column;min-width:0}
.pess b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pess small{font-size:11.5px;color:var(--tinta3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pess .av{width:26px;height:26px;font-size:10.5px}
tr.grp td{height:auto;background:#F7F8FA;border-bottom:1px solid var(--linha)}
tr.grp td.nm{padding:8px 12px;font-size:12.5px;background:#F7F8FA;white-space:nowrap}
tr.grp td.nm span{color:var(--tinta2);font-weight:500}
tr.grp td.nm em{font-style:normal;margin-left:8px;font-size:11.5px;color:var(--tinta2);background:var(--sup);border:1px solid var(--linha);border-radius:999px;padding:1px 8px}
td.c{cursor:pointer;font-weight:700;font-size:11.5px;position:relative;color:transparent}
td.c.T{color:#C4CAD5}
td.c.T::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#C4CAD5}
td.c.T{color:transparent}
td.c.F,td.c.FE,td.c.AT,td.c.FT{color:inherit}
td.c.F{background:var(--cF);color:var(--tF)}
td.c.FE{background:var(--cFE);color:var(--tFE)}
td.c.AT{background:var(--cAT);color:var(--tAT)}
td.c.FT{background:var(--cFT);color:var(--tFT)}
td.c.v{background:repeating-linear-gradient(45deg,#fff 0 4px,#F3F4F7 4px 5px)}
td.c.dom.T,td.c.dom.v{box-shadow:inset 1px 0 0 #F6E2DF}
td.hj{box-shadow:inset 2px 0 0 var(--ouro),inset -2px 0 0 var(--ouro)!important}
td.c.wk{box-shadow:inset 0 -3px 0 var(--ouro)}
td.c.bad{box-shadow:inset 0 0 0 2px var(--verm)!important}
td.c.req::before{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--ouro);box-shadow:0 0 0 2px #fff}
td.c:not(.ro):hover{outline:2px solid var(--tinta);outline-offset:-2px;z-index:1}
td.c.ro{cursor:pointer}
td.c.ro:hover{outline:2px solid var(--ouro);outline-offset:-2px}
tr.cov td{height:28px;font-size:11.5px;font-weight:600;color:var(--tinta3);background:#FCFCFD}
tr.cov td.nm{font-weight:500;background:#FCFCFD}
tr.cov td.low{color:var(--verm);background:var(--verm-cl)}
.okc{color:var(--verde)}
.okc .ic{width:16px;height:16px;stroke-width:2.2;vertical-align:middle}
.leg{display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--linha);font-size:12.5px;color:var(--tinta2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:16px;height:16px;border-radius:4px;background:#fff;border:1px solid var(--linha);position:relative}
.lg.bad{box-shadow:inset 0 0 0 2px var(--verm);border-color:transparent}
.lg.wk{box-shadow:inset 0 -3px 0 var(--ouro)}
.lg.req::before{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--ouro)}
.lg.low{background:var(--verm-cl);border-color:#F5C4BC}
.dica2{padding:0 16px 14px;margin:0}
.alertas{display:flex;flex-direction:column;gap:12px}
.al{display:flex;gap:10px;align-items:flex-start}
.al ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.al li.grave{color:var(--verm)}

/* pedidos */
.peds{display:flex;flex-direction:column;gap:12px}
.ped{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r3);padding:16px 18px}
.ped-h{display:flex;align-items:flex-start;gap:12px}
.ped-t{flex:1;display:flex;flex-direction:column}
.ped-t b{font-weight:700;font-size:15.5px}
.ped-t span{font-size:13px;color:var(--tinta2)}
.tipo{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--linha2);color:var(--tinta2);margin-top:1px}
.t-falta{background:var(--cFT);color:var(--tFT)}.t-atestado{background:var(--cAT);color:var(--tAT)}.t-ferias{background:var(--cFE);color:var(--tFE)}.t-troca{background:var(--cF);color:var(--tF)}
.ped-txt{margin:10px 0 6px;white-space:pre-wrap}
.ped-esc{margin:0 0 4px;font-size:13px;color:var(--tinta2)}
.ped-a{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--linha2)}
.ped-a input{height:38px;border:1px solid var(--linha);border-radius:var(--r2);padding:0 12px;background:#FCFCFD}
.ped-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ped-b .lnk{margin-left:auto}
.ped-r{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:var(--r2);font-size:14px}
.ped-r span{flex:1}
.ped-r small{color:var(--tinta3)}
.ped-r.aprovado{background:var(--verde-cl);color:var(--verde)}
.ped-r.recusado{background:var(--verm-cl);color:var(--verm)}
.ped-r span{color:var(--tinta)}
.st{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.st.espera{background:var(--ouro-cl);color:var(--ouro-esc)}.st.aprovado{background:var(--verde-cl);color:var(--verde)}.st.recusado{background:var(--verm-cl);color:var(--verm)}

/* equipe / listas */
.lista{display:flex;flex-direction:column;border:1px solid var(--linha2);border-radius:var(--r2);overflow:hidden}
.linha{display:grid;grid-template-columns:auto minmax(150px,1.2fr) minmax(140px,1fr) minmax(200px,1.6fr) auto auto;align-items:center;gap:14px;padding:10px 14px;border:0;border-top:1px solid var(--linha2);background:var(--sup);text-align:left;width:100%}
.linha:first-child{border-top:0}
button.linha:hover{background:#FAFBFC}
.linha.inativo{opacity:.55}
.linha .l1{display:flex;flex-direction:column;line-height:1.25}
.linha .l1 small,.linha .l2,.linha .l3{font-size:13px;color:var(--tinta2)}
.linha .chev{color:var(--tinta3)}
.linha.est{grid-template-columns:auto 1fr minmax(140px,200px) minmax(130px,180px) auto}
.linha.est input,.linha.est select{height:34px}
.tag{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--linha2);color:var(--tinta2)}

/* ajustes */
.tab-w{overflow:auto;margin-bottom:12px}

table.t td{padding:6px 8px;border-bottom:1px solid var(--linha2)}
table.t td.r{text-align:right;white-space:nowrap}
input,select,textarea{border:1px solid var(--linha);border-radius:var(--r1);padding:7px 10px;background:var(--sup);min-width:0}

input[type=number]{width:74px}
.in-nome{width:100%;min-width:140px}
textarea{width:100%;min-height:90px;font-size:13px;resize:vertical}
#bkp,#imp{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.row input{flex:1;min-width:200px;height:38px}
.busca{margin-top:14px;padding-top:6px;border-top:1px solid var(--linha2)}
.regras{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:10px}
.regras label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--tinta2)}

/* telas cheias */
.tela{min-height:100vh;display:grid;place-items:center;padding:24px}
.tela-box{max-width:440px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.tela-box .marca{width:44px;height:44px}
.tela-box h1{font:700 24px/1.2 var(--f-tit);margin:6px 0 0}
.tela-box p{margin:0;color:var(--tinta2)}
.codigo{font:600 14px ui-monospace,Menlo,monospace;background:var(--sup);border:1px solid var(--linha);border-radius:var(--r2);padding:10px 14px;user-select:all;word-break:break-all}

/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(23,32,51,.42);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;animation:fade .15s ease-out}
.modal{background:var(--sup);border-radius:16px;width:100%;max-width:560px;padding:20px 22px 22px;box-shadow:0 20px 60px rgba(23,32,51,.25);animation:sobe .18s ease-out}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.modal>p{margin:0 0 16px;color:var(--tinta2)}
.modal-a{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:18px}
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--tinta2)}
.form label>input,.form label>select,.form label>textarea{color:var(--tinta);font-weight:400;font-size:15px;height:40px}
.form label>textarea{height:auto;min-height:96px;font-size:15px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:13.5px;font-weight:600;color:var(--tinta2);margin-bottom:8px;padding:0}
.dias,.tipos{display:flex;gap:6px;flex-wrap:wrap}
.dchip input,.tchip input{position:absolute;opacity:0;pointer-events:none}
.form label.dchip,.form label.tchip{display:inline-flex;flex-direction:row}
.dchip span{display:grid;place-items:center;width:52px;height:38px;border:1px solid var(--linha);border-radius:var(--r1);font-weight:600;color:var(--tinta);font-size:14px;cursor:pointer}
.dchip input:checked+span{background:var(--tinta);border-color:var(--tinta);color:#fff}
.dchip input:focus-visible+span,.tchip input:focus-visible+span{outline:2px solid var(--ouro);outline-offset:2px}
.tchip span{display:inline-flex;align-items:center;height:38px;padding:0 14px;border:1px solid var(--linha);border-radius:999px;font-weight:600;color:var(--tinta);font-size:14px;cursor:pointer}
.tchip input:checked+span{border-color:transparent;box-shadow:inset 0 0 0 2px currentColor}
.tchip.t-falta input:checked+span{background:var(--cFT);color:var(--tFT)}
.tchip.t-atestado input:checked+span{background:var(--cAT);color:var(--tAT)}
.tchip.t-troca input:checked+span{background:var(--cF);color:var(--tF)}
.tchip.t-ferias input:checked+span{background:var(--cFE);color:var(--tFE)}
.tchip.t-outro input:checked+span{background:var(--linha2);color:var(--tinta)}
.tipos .tchip{background:none}
label.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--tinta)!important;font-weight:500!important}
label.chk input{width:18px;height:18px}

/* toast e fab */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:8px;background:var(--tinta);color:#fff;padding:11px 16px;border-radius:var(--r2);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(23,32,51,.3);animation:sobe .2s ease-out}
.toast .ic{color:#6EE7A0}
.fab{display:none}
.rodape{text-align:center;font-size:12.5px;color:var(--tinta3);margin:18px 0 0}
.so-desk{}
@keyframes fade{from{opacity:0}}
@keyframes sobe{from{opacity:0;transform:translateY(8px)}}
.toast{animation-name:sobeT}
@keyframes sobeT{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

@media (max-width:860px){
  .app{display:block}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--tinta);color:#fff;padding:10px 16px}

  .tb-t{flex:1;display:flex;flex-direction:column;line-height:1.15}

  .ph{align-items:flex-start}
  .ph-a{width:100%}
  .pager{flex:1}
  .pager-l{flex:1;min-width:0}
  .painel{padding:14px;border-radius:12px}
  .grade-p{padding:0}
  .dica{display:none}
  .grade-top{padding:10px}
  .pinceis{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .pincel{flex:none}
  .gridwrap{max-height:none}
  table.g .nm{min-width:132px;max-width:150px;padding:4px 8px}
  .linha{grid-template-columns:auto 1fr auto;gap:10px}

  .dchip span{width:44px}
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  .fab{display:inline-flex;align-items:center;gap:8px;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:45;height:50px;padding:0 20px;border:0;border-radius:999px;background:var(--tinta);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(23,32,51,.3)}
  .so-desk{display:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom));width:max-content;max-width:calc(100% - 32px)}
  .demo .lnk{margin-left:0}
  table.semana{table-layout:fixed;width:100%}
  table.semana .nm{min-width:0;width:34%;max-width:none}
  table.semana th,table.semana td{min-width:0}

var painting=null,tap=null;
function paint(td){
  var fid=td.getAttribute('data-f'),k=td.getAttribute('data-k');
  if(painting.done[fid+k])return;painting.done[fid+k]=1;
  var val=painting.val;
  if(val&&val.indexOf('T@')===0){var ff=cad.funcs.find(function(x){return x.id===fid;});if(ff&&ff.turnoId===val.slice(2))val='T';}
  setC(fid,k,val);
  var b=baseC(val);
  td.className=td.className.replace(/\b(T|F|FE|AT|FT|bad|wk|ot|v)\b/g,'').replace(/\s+/g,' ')+' '+(b||'v')+(val!==b?' ot':'');
  td.innerHTML=val!==b?'<b class="lt">'+letraTurno(val.slice(2))+'</b>':(b||'');
}

function startPaint(td){var cur=get(td.getAttribute('data-f'),td.getAttribute('data-k'));painting={val:ui.brush==='toggle'?(cur==='F'?'T':'F'):ui.brush,done:{}};paint(td);}
root.addEventListener('pointerdown',function(ev){

  var td=ev.target.closest('td.c[data-f]');if(!td||ev.button!==0)return;
  if(ev.pointerType!=='mouse'){tap={td:td,x:ev.clientX,y:ev.clientY};return;}

});

function endPaint(ev){
  if(tap&&ev&&ev.type==='pointerup'&&Math.abs(ev.clientX-tap.x)<10&&Math.abs(ev.clientY-tap.y)<10)startPaint(tap.td);
  tap=null;if(!painting)return;painting=null;render();
}
